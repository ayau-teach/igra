.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#000b,#0000 35%,#0000 60%,#000c)}
.hero h1{position:absolute;z-index:2;top:14px;left:0;right:0;text-align:center;margin:0;font-size:clamp(26px,6vw,52px);font-weight:900;text-shadow:0 3px 0 #000,0 0 24px #000}
.hero h1 .f{color:var(--fire2)}.hero h1 .i{color:var(--ice2)}
.hero .bot{position:absolute;z-index:2;bottom:16px;left:0;right:0;text-align:center;padding:0 16px}
.hero p{margin:0 0 12px;text-shadow:0 2px 0 #000;font-size:clamp(14px,2.6vw,19px)}
.go{background:linear-gradient(#ffd23f,#ff8a1f);color:#3a1a00;font-size:22px;padding:14px 40px;border-radius:40px;box-shadow:0 6px 0 #9a4a00;animation:pulse 1.6s infinite}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #9a4a00}
@keyframes pulse{50%{transform:scale(1.06)}}
/* race */
.lane{display:flex;align-items:center;gap:10px;margin:8px 0}
.lane b{width:64px;font-size:18px;text-align:right}
.track{position:relative;flex:1;height:46px;border-radius:30px;background:#0b140d;border:3px solid #4d6a3f;box-shadow:inset 0 4px 10px #000a}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:30px;width:0;transition:width .9s cubic-bezier(.3,1.5,.5,1)}
.lane.fire .fill{background:linear-gradient(90deg,#c1280a,var(--fire),var(--fire2));box-shadow:0 0 18px var(--fire)}

.run.hop{animation:hop .6s}
@keyframes hop{40%{margin-top:-22px}}
.num{width:56px;font-size:20px}
.goal{text-align:center;font-size:13px;opacity:.75;margin-top:-2px}
.pop{position:fixed;z-index:9;font-size:34px;font-weight:900;pointer-events:none;animation:up 1.2s forwards;text-shadow:0 3px 0 #000}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
/* card */
.banner{margin:12px 0 8px;text-align:center;font-size:clamp(18px,3.4vw,26px);font-weight:900;padding:10px;border-radius:14px;color:#fff}
.banner.fire{background:linear-gradient(90deg,#b3200a,var(--fire))}.banner.ice{background:linear-gradient(90deg,#0b62c9,var(--ice))}.banner.bonus{background:linear-gradient(90deg,#7a3bd1,#e03bb0);}
.tbar{height:10px;border-radius:8px;background:#0b140d;overflow:hidden;margin:6px 0 12px}
.tbar i{display:block;height:100%;width:100%;background:var(--gold);transition:width 1s linear}
.card{padding:18px}
.tag{font-size:13px;opacity:.8;margin-bottom:6px}
.q{font-size:clamp(18px,3.2vw,26px);font-weight:900;margin:0 0 14px;line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.opts{grid-template-columns:1fr}.lane b{width:46px;font-size:14px}.run{width:54px;height:54px}}
.opt{padding:14px;border-radius:14px;font-size:clamp(15px,2.6vw,19px);text-align:left;background:linear-gradient(#3b5a3d,#294030);box-shadow:0 4px 0 #0c150e;border:2px solid #5f8a4e}
.opt:hover:not(:disabled){filter:brightness(1.2)}
.opt.ok{background:linear-gradient(#25b559,#12803c);border-color:#9bffbd}
.opt.no{background:linear-gradient(#c43434,#862020);border-color:#ff9b9b;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:14px;padding:12px;border-radius:12px;background:#0007;font-size:16px}
.nx{margin-top:12px;background:linear-gradient(#ffd23f,#ff8a1f);color:#3a1a00;padding:12px 30px;border-radius:30px;font-size:18px;box-shadow:0 5px 0 #9a4a00}
/* bonus */
.pt{display:flex;align-items:center;gap:10px;padding:10px;margin:8px 0;border-radius:12px;background:#0006;flex-wrap:wrap}
.pt span{flex:1;min-width:200px}
.tg{padding:9px 14px;border-radius:20px;opacity:.55;font-size:16px}
.tg.f{background:var(--fire)}.tg.i{background:var(--ice)}.tg.on{opacity:1;outline:3px solid #fff;transform:scale(1.08)}
/* end */
.end{text-align:center;padding:26px}
.end h2{font-size:clamp(28px,6vw,48px);margin:8px 0}
